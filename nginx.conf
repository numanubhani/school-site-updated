server {
    listen 80;
    server_name _;          # replace _ with your domain or server IP

    # ── Frontend (React build) ─────────────────────────────────────────────
    root /var/www/school-site-updated/dist;
    index index.html;

    # React Router — always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API (FastAPI on port 8000) ─────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Allow large file uploads (videos, PDFs)
        client_max_body_size 500M;
    }

    # ── Uploaded files (served directly by nginx, faster than proxying) ────
    location /uploads/ {
        alias /var/www/school-site-updated-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
